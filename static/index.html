<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routes</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171b21; --line:#262b34; --text:#e6e8ec; --muted:#8b93a1;
    --accent:#f0a020; --up:#2fbf6f; --down:#e0525f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 56px}

  header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 82%,transparent);padding:14px 16px 10px}
  .brand{font-size:17px;font-weight:650;letter-spacing:-.01em;color:var(--text)}
  .count{color:var(--muted);font-size:12.5px;margin-left:8px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
  .seg button{border:0;background:transparent;color:var(--muted);padding:8px 13px;font-size:13px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:13.5px}

  /* grade range slider */
  .range{display:flex;flex-direction:column;gap:2px;margin:6px 0 2px}
  .range .labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
  .range input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:24px;background:transparent;pointer-events:none}
  .range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--text);border:2px solid var(--accent);pointer-events:all;cursor:pointer}
  .range input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--text);border:2px solid var(--accent);pointer-events:all;cursor:pointer}
  .rangelabels{font-size:12px;color:var(--muted)}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
  .card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .06s}
  .card:active{transform:scale(.98)}
  .card img{width:100%;display:block;background:var(--panel)}
  .info{padding:9px 11px;display:flex;flex-direction:column;gap:3px}
  .nm{font-size:14px;font-weight:600;line-height:1.25}
  .meta{display:flex;gap:7px;flex-wrap:wrap}
  .tag{font-size:12px;color:var(--accent);font-weight:700}
  .wall{font-size:11.5px;color:var(--muted)}
  .desc{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .votes{display:flex;align-items:center;gap:6px;margin-top:2px}
  .vbtn{background:transparent;border:1px solid var(--line);border-radius:8px;width:30px;height:28px;font-size:13px;line-height:1;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .vbtn.up.on{background:var(--up);color:#04130a;border-color:var(--up)}
  .vbtn.down.on{background:var(--down);color:#fff;border-color:var(--down)}
  .score{min-width:24px;text-align:center;font-weight:650;font-size:14px}
  .score.pos{color:var(--up)} .score.neg{color:var(--down)}
  .empty{padding:48px 0;text-align:center;color:var(--muted);font-size:13.5px}

  /* sheet */
  .scrim{position:fixed;inset:0;background:rgba(8,10,13,.78);z-index:30;display:none}
  .scrim.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);max-height:92vh;overflow:auto;z-index:31;animation:rise .16s ease}
  @keyframes rise{from{transform:translateY(26px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet .wrap{padding:16px}
  .sheet img{width:100%;border-radius:10px;margin-bottom:14px}
  .rg{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
  .rg span{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  .rg span.g{color:#151008;background:var(--accent);border-color:var(--accent);font-weight:700}
  .sheet h2{font-size:18px;letter-spacing:-.01em;margin-top:4px}
  .dd{color:var(--muted);font-size:13.5px;line-height:1.5;margin-top:10px}
  .sv{display:flex;align-items:center;gap:6px;margin-top:2px}
  .foot{color:var(--muted);font-size:12.5px;margin-top:12px}
</style>
</head>
<body>
<header>
  <div class="brand">≡&nbsp;Routes <span class="count" id="count"></span></div>
  <div class="sub" id="sub">tap a card for details</div>
</header>

<main class="wrap" id="main">
  <div class="toolbar">
    <div class="seg" id="sortseg">
      <button data-sort="grade" class="on">Grade</button>
      <button data-sort="new">New</button>
    </div>
    <select id="wall"><option value="">All walls</option></select>
  </div>

  <div class="range">
    <input type="range" id="lo" min="0" max="1" value="0" step="1">
    <input type="range" id="hi" min="0" max="1" value="1" step="1">
    <div class="labels"><span id="loLab"></span><span id="hiLab"></span></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No routes yet.</div>
</main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="wrap">
    <img id="simg" alt="">
    <div class="rg"><span class="g" id="sgrade"></span><span id="swall"></span></div>
    <h2 id="sname"></h2>
    <div class="dd" id="sdesc" hidden></div>
    <div class="sv">
      <button class="vbtn up" id="sUp">▲</button><span class="score" id="sScore">0</span><button class="vbtn down" id="sDn">▼</button>
    </div>
    <div class="foot" id="sfoot"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const state={routes:[],sort:"grade",wall:"",lo:0,hi:0,grades:[],cur:null,initData:""};

(function tg(){
  if(window.Telegram&&window.Telegram.WebApp){
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    if(window.Telegram.WebApp.initData) state.initData=window.Telegram.WebApp.initData;
    const u=window.Telegram.WebApp.initDataUnsafe&&window.Telegram.WebApp.initDataUnsafe.user;
    if(u&&u.first_name)$("#sub").textContent="hey "+u.first_name+" · tap a card for details";
  }
})();

function hdrs(){const h={"Content-Type":"application/json"};if(state.initData)h["X-Telegram-Init-Data"]=state.initData;return h}

async function load(){
  const r=await fetch("/api/routes",{headers:hdrs()}).then(x=>x.json());
  const k=await fetch("/api/meta").then(x=>x.json());
  state.routes=r.routes; state.grades=["all",...k.grades];
  state.hi=state.grades.length-1;
  $("#lo").max=state.hi;$("#hi").max=state.hi;
  $("#lo").value=0;$("#hi").value=state.hi;
  setWallOptions(k.walls);
  paint();
}

function setWallOptions(walls){
  const sel=$("#wall");
  sel.innerHTML='<option value="">All walls</option>'+walls.map(w=>`<option value="${w}">${w}</option>`).join("");
}

function gi(i){return state.grades[i]}
function displayGrade(g){return g==="all"?"Any":g}

function filtered(){
  let l=state.routes;
  if(state.wall)l=l.filter(r=>r.wall===state.wall);
  const lo=gi(state.lo),hi=gi(state.hi);
  // map selected grades to a comparable index using grade_low
  const loIdx=state.grades.indexOf(lo)-1; // index within real scale
  const hiIdx=state.grades.indexOf(hi)-1;
  // special: "all" (loIdx=-1) means no lower bound; wildcards (grade_low<0)
  if(loIdx>=0)l=l.filter(r=>r.grade_low>=loIdx);
  if(hiIdx<state.grades.length-2)l=l.filter(r=>r.grade_low<=hiIdx);
  if(state.sort==="new")l=[...l].sort((a,b)=>b.created_at.localeCompare(a.created_at));
  else l=[...l].sort((a,b)=>b.grade_low-a.grade_low||b.created_at.localeCompare(a.created_at));
  return l;
}

function paint(){
  const list=filtered();
  $("#count").textContent=list.length+" route"+(list.length===1?"":"s");
  const grid=$("#grid"),
        empty=$("#empty");
  empty.hidden=!!list.length;
  grid.innerHTML=list.map(r=>`
    <div class="card" data-id="${r.id}">
      <img loading="lazy" src="/api/photo/${r.id}" alt="">
      <div class="info">
        <div class="nm"></div>
        <div class="meta"><span class="tag">${esc(r.grade)}</span>${r.wall?`<span class="wall">· ${esc(r.wall)}</span>`:""}</div>
        ${r.description?`<div class="desc">${esc(r.description)}</div>`:""}
        <div class="votes">
          <button class="vbtn up${r.my_vote===1?" on":""}" data-v="1">▲</button>
          <span class="score ${sc(r.score)}">${r.score}</span>
          <button class="vbtn down${r.my_vote===-1?" on":""}" data-v="-1">▼</button>
        </div>
      </div>
    </div>`).join("");

  grid.querySelectorAll(".card").forEach(c=>{
    const r=state.routes.find(x=>x.id===Number(c.dataset.id));
    c.querySelector(".nm").textContent=r.name;
    c.onclick=e=>{if(e.target.closest("button"))return;open(r)};
  });
  grid.querySelectorAll(".vbtn").forEach(b=>{
    b.onclick=e=>{e.stopPropagation();vote(Number(b.closest(".card").dataset.id),Number(b.dataset.v))};
  });
  paintSlider();
}

function paintSlider(){
  const loV=displayGrade(gi(state.lo)),hiV=displayGrade(gi(state.hi));
  $("#loLab").textContent=loV+"+";
  $("#hiLab").textContent="≤ "+hiV;
}

function sc(s){return s>0?"pos":(s<0?"neg":"")}

async function vote(id,val){
  if(!state.initData){alert("Open via Telegram to vote (one vote per account).");return}
  try{
    const res=await fetch(`/api/vote/${id}`,{method:"POST",headers:hdrs(),body:JSON.stringify({value:val})});
    const d=await res.json();
    if(res.status===401){alert("Not verified. Reopen from Telegram.");return}
    const r=state.routes.find(x=>x.id===id);
    if(r&&d.score!==undefined){r.upvotes=d.upvotes;r.downvotes=d.downvotes;r.score=d.score;r.my_vote=d.value}
    paint();
    if(state.cur&&state.cur.id===id)open(state.cur);
  }catch(err){}
}

function open(r){
  state.cur=r;
  $("#simg").src=`/api/photo/${r.id}`;
  $("#sgrade").textContent=r.grade;
  const w=$("#swall");w.style.display=r.wall?"":"none";w.textContent="🧗 "+r.wall;
  $("#sname").textContent=r.name;
  const dd=$("#sdesc");dd.hidden=!r.description;dd.textContent=r.description;
  const sc=$("#sScore"),su=$("#sUp"),sd=$("#sDn");
  sc.className="score "+sc(r.score);sc.textContent=r.score;
  su.className="vbtn up"+(r.my_vote===1?" on":"");
  sd.className="vbtn down"+(r.my_vote===-1?" on":"");
  $("#sfoot").textContent=((r.setter_name?"set by "+r.setter_name:""))+fmtDate(r.created_at);
  $("#scrim").classList.add("open");
}
function fmtDate(d){try{const dt=new Date(d.replace(" ","T")+"Z");return dt.toLocaleDateString(undefined,{day:"numeric",month:"short"})}catch(e){return d}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

$("#scrim").onclick=()=>$("#scrim").classList.remove("open");
$("#sortseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  state.sort=b.dataset.sort;
  $("#sortseg").querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  paint();
});
$("#wall").onchange=e=>{state.wall=e.target.value;paint()};
$("#lo").oninput=e=>{if(+e.target.value>state.hi)e.target.value=state.hi;state.lo=+e.target.value;paint()};
$("#hi").oninput=e=>{if(+e.target.value<state.lo)e.target.value=state.lo;state.hi=+e.target.value;paint()};
$("#sUp").onclick=()=>state.cur&&vote(state.cur.id,1);
$("#sDn").onclick=()=>state.cur&&vote(state.cur.id,-1);

load();
</script>
</body>
</html>
